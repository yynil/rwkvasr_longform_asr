[package]
name = "rwkvasr-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = "0.9.2"
arrow-array = "56"
flate2 = "1.0"
indicatif = "0.18"
parquet = { version = "56", features = ["arrow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = false
